[project]
name = "sakina-notebooks"
version = "0.1.0"
description = "Sakina training + RAG ingestion notebooks (4 modules per ITI brief)"
requires-python = "==3.11.*"
dependencies = [
    # workspace sibling — pulls in torch, transformers, qdrant, groq, etc.
    "sakina-api",
    # jupyter
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    # datasets + training
    "datasets>=3.1",
    "accelerate>=1.1",
    "evaluate>=0.4",
    "huggingface-hub>=0.26",
    "sentencepiece>=0.2",    # NLLB-200 translator tokenizer (NB 02)
    # Note: no fine-tuning anywhere. NB 02 is translate-then-classify
    # (NLLB-200 + a pretrained DistilBERT emotion model) — no peft/trl/unsloth.
    # NB 03 (intent) is a plain hand-written few-shot prompt over the `openai` client —
    # DSPy was removed (MIPROv2 scored 95.83% vs 100% zero-shot), so no dspy-ai dependency.
    # plotting + EDA
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    # RAG eval (notebook 04)
    "ragas>=0.2",
    # progress bars in notebooks
    "tqdm>=4.66",
    "optuna>=4.8.0",
]

[tool.uv.sources]
sakina-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
