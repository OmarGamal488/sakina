# Local observability stack: Sakina API + OpenTelemetry Collector → Axiom.
#
# Usage:
#   1) copy .env.example -> .env  and fill AXIOM_TOKEN + AXIOM_DATASET
#      (plus LIGHTNING_API_KEY / QDRANT_* if you want a working /chat)
#   2) docker compose up --build
#   3) send traffic to http://localhost:8000/chat, /feedback
#   4) watch metrics arrive in Axiom (dataset = AXIOM_DATASET)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Point the app's OTLP exporter at the collector service below.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      LIGHTNING_API_KEY: "${LIGHTNING_API_KEY:-}"
      QDRANT_URL: "${QDRANT_URL:-}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      REDIS_URL: "${REDIS_URL:-}"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      AXIOM_TOKEN: "${AXIOM_TOKEN}"
      AXIOM_DATASET: "${AXIOM_DATASET}"
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
